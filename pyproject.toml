[project]
name = "benji-webhook-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic>=2.8"]

[dependency-groups]
dev = ["pytest>=8.2", "anyio>=4.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "receiver"]
